name: Finalize gizmo visibility

on:
  push:
    branches:
      - agent/gizmo-visibility-sync
    paths:
      - .github/workflows/finalize-gizmo-visibility.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final visibility changes
        run: python3 .github/scripts/finalize_gizmo_visibility.py

      - name: Validate JavaScript syntax
        run: |
          node --check light_manager.js
          node --check lightflow_atmosphere.js
          node --check lightflow_environment.js

      - name: Validate visibility coverage
        run: |
          grep -q "lightManagerLightGizmosVisible" light_manager.js
          grep -q "canShowVolumeGizmos" lightflow_atmosphere.js
          grep -q "canShowEnvironmentShadowGizmo" lightflow_environment.js
          git diff --check

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add light_manager.js lightflow_environment.js
          git diff --cached --check
          git commit -m "Hide all light gizmos with visibility controls"
          git push

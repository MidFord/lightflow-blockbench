name: Apply gizmo visibility update

on:
  push:
    branches:
      - agent/gizmo-visibility-sync
    paths:
      - .github/workflows/apply-gizmo-visibility-update.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted gizmo visibility changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def regex_once(path, pattern, replacement, label, flags=0):
              text = path.read_text(encoding='utf-8')
              text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              path.write_text(text, encoding='utf-8')

          light_manager = Path('light_manager.js')
          atmosphere = Path('lightflow_atmosphere.js')
          environment = Path('lightflow_environment.js')

          replace_once(
              light_manager,
              """function unregisterLightManagerCanvasGizmo(object) {
              if (!object || !window.Canvas || !Array.isArray(Canvas.gizmos)) return;
              const index = Canvas.gizmos.indexOf(object);
              if (index >= 0) Canvas.gizmos.splice(index, 1);
          }

          if (window.LightManagerAreaGizmos && typeof window.LightManagerAreaGizmos.clear === 'function') {""",
              """function unregisterLightManagerCanvasGizmo(object) {
              if (!object || !window.Canvas || !Array.isArray(Canvas.gizmos)) return;
              const index = Canvas.gizmos.indexOf(object);
              if (index >= 0) Canvas.gizmos.splice(index, 1);
          }

          function lightManagerCanvasGizmosVisible() {
              return !window.Canvas || Canvas.show_gizmos !== false;
          }

          function refreshLightManagerGizmoVisibility() {
              const visible = lightManagerCanvasGizmosVisible();
              const lights = window.LightElement && Array.isArray(window.LightElement.all)
                  ? window.LightElement.all
                  : [];
              lights.forEach(element => {
                  const mesh = element?.mesh;
                  if (!mesh) return;
                  mesh.visible = element.visibility !== false && visible;
                  if (mesh.sprite) mesh.sprite.visible = visible;
                  if (mesh.gizmo) mesh.gizmo.visible = visible;
              });
              window.LightManagerAreaGizmos?.updateAll();
              window.LightManagerViewportControls?.updateAll();
              const LightflowGizmoEvent = window.CustomEvent;
              if (typeof window.dispatchEvent === 'function' && typeof LightflowGizmoEvent === 'function') {
                  window.dispatchEvent(new LightflowGizmoEvent('lightflow_gizmo_visibility_changed', {
                      detail: {
                          showGizmos: visible,
                          showLightAreaGizmos: window.LightManagerAreaGizmos?.enabled !== false
                      }
                  }));
              }
          }

          window.LightManagerRefreshGizmoVisibility = refreshLightManagerGizmoVisibility;

          if (window.LightManagerAreaGizmos && typeof window.LightManagerAreaGizmos.clear === 'function') {""",
              'insert shared light gizmo visibility refresh'
          )

          replace_once(
              light_manager,
              "if (!window.scene || !this.enabled || (window.Canvas && Canvas.show_gizmos === false)) return null;",
              "if (!window.scene || !this.enabled || !lightManagerCanvasGizmosVisible()) return null;",
              'area gizmo group visibility'
          )
          replace_once(
              light_manager,
              "if (!this.enabled || (window.Canvas && Canvas.show_gizmos === false)) {",
              "if (!this.enabled || !lightManagerCanvasGizmosVisible()) {",
              'area gizmo update visibility'
          )
          replace_once(
              light_manager,
              """    setEnabled(enabled) {
                  this.enabled = !!enabled;
                  lightManagerSafeSet(LIGHT_MANAGER_STORAGE_KEYS.areaGizmos, this.enabled ? 'true' : 'false');
                  if (this.enabled) this.updateAll();
                  else this.clear();
                  window.LightManagerViewportControls?.updateAll();
              },""",
              """    setEnabled(enabled) {
                  this.enabled = !!enabled;
                  lightManagerSafeSet(LIGHT_MANAGER_STORAGE_KEYS.areaGizmos, this.enabled ? 'true' : 'false');
                  if (!this.enabled) this.clear();
                  window.LightManagerRefreshGizmoVisibility?.();
              },""",
              'area gizmo toggle refresh'
          )

          regex_once(
              light_manager,
              r"(window\.LightManagerViewportControls = \{.*?\n    getGroup\(\) \{\n)        if \(!window\.scene\) return null;",
              lambda match: match.group(1) + "        if (!window.scene || !this.canShowViewportGizmos()) return null;",
              'viewport control group visibility',
              re.S
          )
          replace_once(
              light_manager,
              """    updateAll() {
                  if (!this.isEditMode() || !this.canShowViewportGizmos()) {
                      this.clearHelpersOnly();
                      return;
                  }""",
              """    updateAll() {
                  if (!this.isEditMode() || !this.canShowViewportGizmos()) {
                      this.clearMoveIndicator();
                      this.clearHelpersOnly();
                      return;
                  }""",
              'viewport control cleanup'
          )
          replace_once(
              light_manager,
              "mesh.visible = element.visibility;",
              "mesh.visible = element.visibility !== false && lightManagerCanvasGizmosVisible();",
              'light proxy setup visibility'
          )
          replace_once(
              light_manager,
              """                updateSelection(element, options = {}) {
                      let { mesh } = element;

                      let desiredTexture = lightTextures[element.light_type] || lightTextures.point;""",
              """                updateSelection(element, options = {}) {
                      let { mesh } = element;
                      const canvasGizmosVisible = lightManagerCanvasGizmosVisible();
                      mesh.visible = element.visibility !== false && canvasGizmosVisible;
                      if (mesh.sprite) mesh.sprite.visible = canvasGizmosVisible;
                      if (mesh.gizmo) mesh.gizmo.visible = canvasGizmosVisible;

                      let desiredTexture = lightTextures[element.light_type] || lightTextures.point;""",
              'light proxy update visibility'
          )
          replace_once(
              light_manager,
              """                if (result.show_gizmos !== undefined || result.show_light_area_gizmos !== undefined) {
                      window.LightManagerAreaGizmos.updateAll();
                      window.LightManagerViewportControls?.updateAll();
                  }""",
              """                if (result.show_gizmos !== undefined || result.show_light_area_gizmos !== undefined) {
                      window.LightManagerRefreshGizmoVisibility?.();
                  }""",
              'view options refresh'
          )
          replace_once(
              light_manager,
              """    'LightManagerAreaGizmos',
              'LightManagerViewportControls',""",
              """    'LightManagerAreaGizmos',
              'LightManagerViewportControls',
              'LightManagerRefreshGizmoVisibility',""",
              'track gizmo refresh binding'
          )

          replace_once(
              atmosphere,
              """    function updateVolumeGizmo(volume) {
                  const mesh = volume?.mesh;
                  if (!mesh) return;
                  sanitizeVolume(volume);
                  const size = volume.size;
                  mesh.visible = volume.visibility !== false;
                  if (mesh.boxGizmo) {
                      mesh.boxGizmo.visible = volume.shape !== 'sphere';
                      mesh.boxGizmo.scale.set(size[0], size[1], size[2]);
                  }
                  if (mesh.sphereGizmo) {
                      mesh.sphereGizmo.visible = volume.shape === 'sphere';
                      mesh.sphereGizmo.scale.set(size[0], size[1], size[2]);
                  }
                  if (mesh.boxSelection) {
                      mesh.boxSelection.scale.set(size[0], size[1], size[2]);
                  }
                  if (mesh.sphereSelection) {
                      mesh.sphereSelection.scale.set(size[0], size[1], size[2]);
                  }""",
              """    function canShowVolumeGizmos() {
                  return !window.Canvas || Canvas.show_gizmos !== false;
              }

              function refreshVolumeGizmoVisibility() {
                  if (!VolumeElement || !Array.isArray(VolumeElement.all)) return;
                  VolumeElement.all.forEach(volume => updateVolumeGizmo(volume));
              }

              function updateVolumeGizmo(volume) {
                  const mesh = volume?.mesh;
                  if (!mesh) return;
                  sanitizeVolume(volume);
                  const size = volume.size;
                  const showGizmos = canShowVolumeGizmos();
                  mesh.visible = volume.visibility !== false && showGizmos;
                  if (mesh.boxGizmo) {
                      mesh.boxGizmo.visible = showGizmos && volume.shape !== 'sphere';
                      mesh.boxGizmo.scale.set(size[0], size[1], size[2]);
                  }
                  if (mesh.sphereGizmo) {
                      mesh.sphereGizmo.visible = showGizmos && volume.shape === 'sphere';
                      mesh.sphereGizmo.scale.set(size[0], size[1], size[2]);
                  }
                  if (mesh.boxSelection) {
                      mesh.boxSelection.visible = showGizmos && volume.shape !== 'sphere';
                      mesh.boxSelection.scale.set(size[0], size[1], size[2]);
                  }
                  if (mesh.sphereSelection) {
                      mesh.sphereSelection.visible = showGizmos && volume.shape === 'sphere';
                      mesh.sphereSelection.scale.set(size[0], size[1], size[2]);
                  }""",
              'volume gizmo visibility'
          )
          replace_once(
              atmosphere,
              "if (!proxy || this.visible === false) return;",
              "if (!canShowVolumeGizmos() || !proxy || this.visible === false) return;",
              'volume gizmo raycast visibility'
          )
          replace_once(
              atmosphere,
              """            window.addEventListener('light_manager_initialized', lightManagerListener);
                  const depthMutationListeners = [""",
              """            window.addEventListener('light_manager_initialized', lightManagerListener);
                  const gizmoVisibilityListener = () => refreshVolumeGizmoVisibility();
                  const viewListener = Blockbench.on('update_view', gizmoVisibilityListener);
                  window.addEventListener('lightflow_gizmo_visibility_changed', gizmoVisibilityListener);
                  const depthMutationListeners = [""",
              'atmosphere gizmo listeners'
          )
          replace_once(
              atmosphere,
              """            deletables.push(studioListener, selectionListener, ...depthMutationListeners, ...sceneMutationListeners, {
                      delete() { window.removeEventListener('light_manager_initialized', lightManagerListener); }
                  });
                  syncAtmospherePanel();""",
              """            deletables.push(studioListener, selectionListener, viewListener, ...depthMutationListeners, ...sceneMutationListeners, {
                      delete() {
                          window.removeEventListener('light_manager_initialized', lightManagerListener);
                          window.removeEventListener('lightflow_gizmo_visibility_changed', gizmoVisibilityListener);
                      }
                  });
                  refreshVolumeGizmoVisibility();
                  syncAtmospherePanel();""",
              'atmosphere gizmo listener cleanup'
          )

          replace_once(
              environment,
              """    function updateSunShadowGizmo() {
                  const gizmo = createSunShadowGizmo();""",
              """    function canShowEnvironmentShadowGizmo() {
                  return (!window.Canvas || Canvas.show_gizmos !== false) &&
                      (!window.LightManagerAreaGizmos || LightManagerAreaGizmos.enabled !== false);
              }

              function updateSunShadowGizmo() {
                  const gizmo = createSunShadowGizmo();""",
              'environment gizmo visibility helper'
          )
          replace_once(
              environment,
              """            settings.shadow_auto_fit &&
                      (!window.Canvas || Canvas.show_gizmos !== false)
                  );""",
              """            settings.shadow_auto_fit &&
                      canShowEnvironmentShadowGizmo()
                  );""",
              'environment gizmo show condition'
          )
          replace_once(
              environment,
              "if (event.button !== 0 || !sunShadowGizmo?.root?.visible || window.Canvas?.show_gizmos === false) return;",
              "if (event.button !== 0 || !sunShadowGizmo?.root?.visible || !canShowEnvironmentShadowGizmo()) return;",
              'environment gizmo interaction condition'
          )
          replace_once(
              environment,
              """            const viewListener = Blockbench.on('update_view', () => updateSunShadowGizmo());
                  const lightManagerListener = () => {
                      ensureSunLightParent();
                      updateScene({ forceShadow: true });
                  };
                  window.addEventListener('light_manager_initialized', lightManagerListener);
                  deletables.push(...textureListeners, viewListener, {
                      delete() { window.removeEventListener('light_manager_initialized', lightManagerListener); }
                  });""",
              """            const gizmoVisibilityListener = () => updateSunShadowGizmo();
                  const viewListener = Blockbench.on('update_view', gizmoVisibilityListener);
                  const lightManagerListener = () => {
                      ensureSunLightParent();
                      updateScene({ forceShadow: true });
                  };
                  window.addEventListener('light_manager_initialized', lightManagerListener);
                  window.addEventListener('lightflow_gizmo_visibility_changed', gizmoVisibilityListener);
                  deletables.push(...textureListeners, viewListener, {
                      delete() {
                          window.removeEventListener('light_manager_initialized', lightManagerListener);
                          window.removeEventListener('lightflow_gizmo_visibility_changed', gizmoVisibilityListener);
                      }
                  });""",
              'environment gizmo listeners'
          )

          for path, required in [
              (light_manager, 'LightManagerRefreshGizmoVisibility'),
              (atmosphere, 'canShowVolumeGizmos'),
              (environment, 'canShowEnvironmentShadowGizmo')
          ]:
              text = path.read_text(encoding='utf-8')
              if required not in text:
                  raise RuntimeError(f'{path}: missing {required}')
          PY

      - name: Validate JavaScript syntax
        run: |
          node --check light_manager.js
          node --check lightflow_atmosphere.js
          node --check lightflow_environment.js

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add light_manager.js lightflow_atmosphere.js lightflow_environment.js
          git diff --cached --check
          git commit -m "Respect global gizmo visibility"
          git push

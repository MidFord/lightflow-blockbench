name: Apply gizmo visibility update

on:
  push:
    branches:
      - agent/gizmo-visibility-sync
    paths:
      - .github/workflows/apply-gizmo-visibility-update.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted changes
        run: python3 .github/scripts/apply_gizmo_visibility.py

      - name: Validate JavaScript syntax
        run: |
          node --check light_manager.js
          node --check lightflow_atmosphere.js
          node --check lightflow_environment.js

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add light_manager.js lightflow_atmosphere.js lightflow_environment.js
          git diff --cached --check
          git commit -m "Respect global gizmo visibility"
          git push
